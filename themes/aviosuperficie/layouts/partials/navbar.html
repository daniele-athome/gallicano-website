<header class="navbar" id="navbar">
  <div class="navbar__inner">

    <!-- Logo -->
    <a href="{{ "/" | relURL }}" class="navbar__logo" aria-label="{{ .Site.Params.siteName }}">
      <span class="navbar__logo-icon" aria-hidden="true">
        {{ partial "logo.html" . }}
      </span>
      <span class="navbar__logo-text">
        <strong>{{ .Site.Params.siteName }}</strong>
        <em>{{ .Site.Params.siteSubtitle }}</em>
      </span>
    </a>

    <!-- Hamburger (mobile) -->
    <button class="navbar__burger" id="navburger" aria-label="Menu" aria-expanded="false" aria-controls="navmenu">
      <span></span><span></span><span></span>
    </button>

    <!-- Nav links -->
    <nav class="navbar__menu" id="navmenu" role="navigation" aria-label="Menu principale">
      <ul class="navbar__links">
        {{ range .Site.Params.nav }}
        <li>
          <a href="{{ .url | relURL }}"
             class="navbar__link{{ if eq $.RelPermalink (.url | relURL) }} is-active{{ end }}">
            {{ .name }}
          </a>
        </li>
        {{ end }}
      </ul>

      {{ with .Site.Params.navCta }}
        {{ range . }}
        <a href="{{ .url | relURL }}" class="navbar__cta" target="_blank">{{ .name }}</a>
        {{ end }}
      {{ end }}
    </nav>

  </div>
</header>
