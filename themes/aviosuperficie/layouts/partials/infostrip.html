{{- $runway := site.Params.runway -}}
<div class="infostrip">
  <div class="infostrip__item">
    <i class="ti ti-dashboard" aria-hidden="true"></i>
    <div>
      <span class="infostrip__label">Pista</span>
      <span class="infostrip__value">{{ $runway.orientation }} · {{ $runway.dimensions }} · {{ $runway.surface }}</span>
    </div>
  </div>
  <div class="infostrip__item">
    <i class="ti ti-radio" aria-hidden="true"></i>
    <div>
      <span class="infostrip__label">Frequenza</span>
      <span class="infostrip__value">{{ $runway.frequency }}</span>
    </div>
  </div>
  <div class="infostrip__item">
    <i class="ti ti-map-pin" aria-hidden="true"></i>
    <div>
      <span class="infostrip__label">Posizione</span>
      <span class="infostrip__value">
        {{ $runway.coordinates }}
        <a href="{{ $runway.mapsUrl }}" target="_blank" class="infostrip__iconlink"><i class="ti ti-external-link"></i></a>
      </span>
    </div>
  </div>
  <div class="infostrip__item">
    <i class="ti ti-map-pin" aria-hidden="true"></i>
    <div>
      <span class="infostrip__label">Elevazione</span>
      <span class="infostrip__value">{{ $runway.elevation }}</span>
    </div>
  </div>
</div>
